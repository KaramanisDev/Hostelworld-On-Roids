name: Quality Assurance

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  lint:
    name: Run Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: yarn lint:tsc
      - run: yarn lint:eslint
      - run: yarn lint:scss
      - run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            yarn lint:commit --branch "${{ github.base_ref }}"
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            yarn lint:commit --from "${{ github.event.before }}"
          else
            yarn lint:commit --branch master
          fi

  audit:
    name: Run Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: yarn npm audit --severity moderate
